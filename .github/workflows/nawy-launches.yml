name: Refresh Nawy launches

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-nawy-launches.mjs
      - name: Commit launch refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/new-launches.json
          if git diff --cached --quiet; then
            echo "No launch changes"
            exit 0
          fi
          git commit -m "Refresh Nawy new launches"
          git push
